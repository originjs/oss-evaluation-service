server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端请求 /oss-evaluation-api/** 转发到 api-server。
    # 基于 $request_uri(而非 $uri)去掉前缀,保证仓库名里的
    # %2F 等百分号编码字符原样透传,不被 nginx 解码。
    location /oss-evaluation-api/ {
        rewrite ^ $request_uri;
        rewrite ^/oss-evaluation-api(/.*) $1 break;
        return 400;
        proxy_pass http://api-server:3000$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /api-docs {
        proxy_pass http://api-server:3000/api-docs;
        proxy_set_header Host $host;
    }
}
